[pytest]
# Pytest Configuration File
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Minimum Python version
minversion = 6.0
# Test paths
testpaths = tests
# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=scripts
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
    --junit-xml=test_results.xml
# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    database: marks tests that require database connection
    data_generation: marks data generation tests
    ingestion: marks ingestion tests
    transformation: marks transformation tests
    quality: marks quality check tests
# Logging configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
# Timeout for tests (seconds)
timeout = 300
# Doctest configuration
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS
# Coverage configuration
[coverage:run]
source = scripts
omit = 
    */tests/*
    */__pycache__/*
    setup.py
[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
[coverage:html]
directory = htmlcov
